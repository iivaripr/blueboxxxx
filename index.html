        />

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100svw;
                height: 100svh;
                overflow: hidden;
                touch-action: manipulation;
            }
            body {
                background: linear-gradient(#3366cf, #22337f);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .name {
                transition: letter-spacing, opacity;
                transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
                transition-duration: 1.5s;
                font-family: "Barlow Condensed", sans-serif;
                font-size: min(4rem, 10vw);
                user-select: none;
                letter-spacing: -16px;
                color: white;
                opacity: 0%;
            }
            .name.loaded {
                letter-spacing: 0px;
                opacity: 100%;
                text-shadow: 0px 4px 8px #0002;
            }
            .name span {
                color: #8af;
            }

            p span {

            }
        </style>
    </head>
    <body>
        <div class="name">bluebo<span>xxxx</span></div>
        <p>The World's Greatest Music Producer <span>(according to me)</span></p>
        <script>
            window.addEventListener("load", () => {
                setTimeout(() => {
                    document.querySelector(".name").classList.add("loaded");
                }, 100);
            });
        </script>
    </body>
